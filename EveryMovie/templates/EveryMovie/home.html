{% extends "EveryMovie/base.html" %}
{% block content %}

<div class="panel">
  <div class="scatter" id="genreScatter" aria-label="Genre selection"></div>
  <div class="status" id="genreStatus">Loading genres…</div>
</div>

<div class="panel">
  <div class="controls">
    <label class="hint">Country</label>
    <select id="countrySelect" disabled>
      <option value="">Select a country</option>
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
      <option value="FR">France</option>
      <option value="DE">Germany</option>
      <option value="IT">Italy</option>
      <option value="ES">Spain</option>
      <option value="NL">Netherlands</option>
      <option value="SE">Sweden</option>
      <option value="DK">Denmark</option>
      <option value="NO">Norway</option>
      <option value="PL">Poland</option>
      <option value="TR">Turkey</option>
      <option value="IN">India</option>
      <option value="JP">Japan</option>
      <option value="KR">South Korea</option>
      <option value="CN">China</option>
      <option value="TW">Taiwan</option>
      <option value="HK">Hong Kong</option>
      <option value="MX">Mexico</option>
      <option value="BR">Brazil</option>
      <option value="AR">Argentina</option>
      <option value="EG">Egypt</option>
      <option value="ZA">South Africa</option>
      <option value="AU">Australia</option>
    </select>

    <label class="hint">Sort</label>
    <select id="sortSelect" disabled>
      <option value="rating">TMDb rating</option>
      <option value="az">A–Z</option>
    </select>

    <button id="goBtn" disabled>Discover</button>
  </div>

  <div class="status" id="discoverStatus">Choose a genre to begin.</div>
  <div class="grid" id="movieGrid"></div>
</div>

<script>
  // ---- state ----
  let selectedGenreId = null;

  const el = {
    scatter: document.getElementById("genreScatter"),
    genreStatus: document.getElementById("genreStatus"),
    country: document.getElementById("countrySelect"),
    sort: document.getElementById("sortSelect"),
    go: document.getElementById("goBtn"),
    status: document.getElementById("discoverStatus"),
    grid: document.getElementById("movieGrid"),
  };

  // ---- helpers ----
  function setEnabled(enabled) {
    el.country.disabled = !enabled;
    el.sort.disabled = !enabled;
    el.go.disabled = !enabled || !el.country.value;
  }

  function posterUrl(path) {
    if (!path) return null;
    return `https://image.tmdb.org/t/p/w342${path}`;
  }

  function clearGrid() {
    el.grid.innerHTML = "";
  }

  function renderMovies(movies) {
    clearGrid();

    if (!movies || movies.length === 0) {
      el.status.textContent = "No results. Try another country or genre.";
      return;
    }

    for (const m of movies) {
      const card = document.createElement("div");
      card.className = "card";

      const poster = document.createElement("div");
      poster.className = "poster";

      const url = posterUrl(m.poster_path);
      if (url) {
        const img = document.createElement("img");
        img.src = url;
        img.alt = m.title || m.original_title || "Movie poster";
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "cover";
        poster.innerHTML = "";
        poster.appendChild(img);
      } else {
        poster.textContent = "No poster";
      }

      const meta = document.createElement("div");
      meta.className = "meta";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = m.original_title || m.title || "Untitled";

      const sub = document.createElement("div");
      sub.className = "sub";

      const year = document.createElement("span");
      year.textContent = (m.release_date ? m.release_date.slice(0,4) : "—");

      const rating = document.createElement("span");
      rating.textContent = (typeof m.vote_average === "number" ? `★ ${m.vote_average.toFixed(1)}` : "★ —");

      sub.appendChild(year);
      sub.appendChild(rating);

      meta.appendChild(title);
      meta.appendChild(sub);

      card.appendChild(poster);
      card.appendChild(meta);

      el.grid.appendChild(card);
    }
  }

  function placeChips(items) {
    el.scatter.innerHTML = "";

    const W = el.scatter.clientWidth || el.scatter.offsetWidth;
    const H = el.scatter.clientHeight || el.scatter.offsetHeight;
    if (!W || !H) {
      // Fallback: simple stacked layout if we can't measure the area
      items.forEach((item, i) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = item.name;
        chip.dataset.genreId = item.id;
        chip.style.left = "8px";
        chip.style.top = `${8 + i * 40}px`;

        chip.addEventListener("click", () => {
          selectedGenreId = item.id;
          document.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
          chip.classList.add("selected");
          el.genreStatus.textContent = `Selected genre: ${item.name}`;
          el.status.textContent = "Now select a country, then click Discover.";
          setEnabled(true);
        });

        el.scatter.appendChild(chip);
      });
      return;
    }

    // First, create all chips so we can measure their sizes
    const chipItems = items.map((item) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = item.name;
      chip.dataset.genreId = item.id;
      chip.style.visibility = "hidden";
      el.scatter.appendChild(chip);
      const width = chip.offsetWidth || 80;
      const height = chip.offsetHeight || 32;
      return { item, chip, width, height, x: 0, y: 0 };
    });

    const padding = 10;
    const maxAttempts = 200;

    function overlaps(a, b) {
      const ax = a.x + a.width / 2;
      const ay = a.y + a.height / 2;
      const bx = b.x + b.width / 2;
      const by = b.y + b.height / 2;
      const dx = ax - bx;
      const dy = ay - by;
      const distSq = dx * dx + dy * dy;
      // radius is roughly "button radius" plus a tiny margin so they never touch
      const ra = Math.max(a.width, a.height) / 2;
      const rb = Math.max(b.width, b.height) / 2;
      const margin = 10; // tiny bit further than touching
      const minDist = ra + rb + margin;
      return distSq < minDist * minDist;
    }

    const placed = [];

    chipItems.forEach((item) => {
      const maxX = Math.max(padding, W - item.width - padding);
      const maxY = Math.max(padding, H - item.height - padding);

      let attempt = 0;
      let ok = false;
      while (attempt < maxAttempts && !ok) {
        // random position within the scatter area
        const x = padding + Math.random() * (maxX - padding);
        const y = padding + Math.random() * (maxY - padding);

        item.x = x;
        item.y = y;

        ok = true;
        for (const other of placed) {
          if (overlaps(item, other)) {
            ok = false;
            break;
          }
        }
        attempt++;
      }

      if (ok) {
        placed.push(item);
      } else {
        // If we really can't find a non-overlapping spot, drop this chip
        // rather than forcing an overlap.
        item.chip.remove();
      }
    });

    // Apply final positions and behaviour
    placed.forEach(({ item, chip, x, y }) => {
      chip.style.left = `${x}px`;
      chip.style.top = `${y}px`;
      chip.style.visibility = "visible";

      chip.addEventListener("click", () => {
        selectedGenreId = item.id;
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
        el.genreStatus.textContent = `Selected genre: ${item.name}`;
        el.status.textContent = "Now select a country, then click Discover.";
        setEnabled(true);
      });
    });
  }

  async function loadGenres() {
    el.genreStatus.textContent = "Loading genres…";
    try {
      const res = await fetch("/genres/");
      if (!res.ok) throw new Error(`Genres error: ${res.status}`);
      const data = await res.json();
      
      // Expecting either {genres:[...], pairs:[...]} or just [...]
      const baseGenres = Array.isArray(data) ? data : (data.genres || []);
      if (!baseGenres.length) {
        el.genreStatus.textContent = "No genres returned from /genres/.";
        return;
      }

      const pairs = Array.isArray(data.pairs) ? data.pairs : [];

      const singleChips = baseGenres.map(g => ({
        id: String(g.id),
        name: g.name,
      }));

      // Turn pair objects into chips; cap to avoid overcrowding
      const MAX_PAIR_CHIPS = 40;
      let pairChips = pairs.map(p => ({
        id: p.id, // already like "18,10749" and usable as with_genres
        name: p.label || p.name || String(p.id),
      }));

      if (pairChips.length > MAX_PAIR_CHIPS) {
        // simple shuffle + slice
        pairChips = pairChips
          .map(p => ({ p, r: Math.random() }))
          .sort((a, b) => a.r - b.r)
          .slice(0, MAX_PAIR_CHIPS)
          .map(x => x.p);
      }

      const allChips = [...singleChips, ...pairChips];

      // Scale scatter height based on how many chips we have so it
      // stays visually balanced and not overcrowded.
      const perRow = 7; // rough target number of chips per visual row
      const rows = Math.max(1, Math.ceil(allChips.length / perRow));
      const baseHeight = 260; // minimum height
      const rowHeight = 56;   // vertical space per "row" of chips
      const targetHeight = Math.max(baseHeight, rows * rowHeight);
      el.scatter.style.height = `${targetHeight}px`;

      el.genreStatus.textContent = "Pick a genre or genre pair.";
      placeChips(allChips);
    } catch (e) {
      el.genreStatus.textContent = `Failed to load genres. ${e.message}`;
    }
  }

  async function discover() {
    if (!selectedGenreId) return;
    if (!el.country.value) return;

    const sort = el.sort.value || "rating";
    const country = el.country.value;

    el.status.textContent = "Discovering…";
    clearGrid();

    const params = new URLSearchParams({
      genre: String(selectedGenreId),
      country: country,
      sort: sort,
    });

    try {
      const res = await fetch(`/discover/?${params.toString()}`);
      if (!res.ok) throw new Error(`Discover error: ${res.status}`);
      const data = await res.json();

      // Expecting either {results:[...]} or [...]
      const movies = Array.isArray(data) ? data : (data.results || []);
      el.status.textContent = `Showing ${movies.length} results.`;
      renderMovies(movies);
    } catch (e) {
      el.status.textContent = `Failed to discover movies. ${e.message}`;
    }
  }

  // ---- events ----
  el.country.addEventListener("change", () => {
    el.go.disabled = !selectedGenreId || !el.country.value;
  });

  el.sort.addEventListener("change", () => {
    if (selectedGenreId && el.country.value) discover();
  });

  el.go.addEventListener("click", discover);

  // initial
  setEnabled(false);
  loadGenres();

  // re-layout chips on resize
  window.addEventListener("resize", () => {
    // quick re-fetchless reposition: read existing chips -> reconstruct from labels/ids
    const chips = Array.from(document.querySelectorAll(".chip")).map(c => ({
      id: c.dataset.genreId,
      name: c.textContent
    }));
    if (chips.length) placeChips(chips);
    // preserve selected state
    if (selectedGenreId) {
      const sel = document.querySelector(`.chip[data-genre-id="${selectedGenreId}"]`);
      if (sel) sel.classList.add("selected");
    }
  });
</script>

{% endblock %}
