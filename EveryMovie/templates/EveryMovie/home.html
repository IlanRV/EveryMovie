{% extends "EveryMovie/base.html" %}
{% block content %}

<div class="panel genre-banner">
  <h2 class="banner-title">Explore by Genre</h2>
  <div class="scatter" id="genreScatter" aria-label="Genre selection"></div>
  <div class="status" id="genreStatus">Loading genres…</div>
</div>

<div class="panel">
  <div class="controls">
    <label class="hint">&#127760; Country</label>
    <select id="countrySelect" disabled>
      <option value="">Select a country</option>
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
      <option value="FR">France</option>
      <option value="DE">Germany</option>
      <option value="IT">Italy</option>
      <option value="ES">Spain</option>
      <option value="NL">Netherlands</option>
      <option value="SE">Sweden</option>
      <option value="DK">Denmark</option>
      <option value="NO">Norway</option>
      <option value="PL">Poland</option>
      <option value="TR">Turkey</option>
      <option value="EC">Ecuador</option>
      <option value="IN">India</option>
      <option value="JP">Japan</option>
      <option value="KR">South Korea</option>
      <option value="CN">China</option>
      <option value="TW">Taiwan</option>
      <option value="HK">Hong Kong</option>
      <option value="MX">Mexico</option>
      <option value="BR">Brazil</option>
      <option value="AR">Argentina</option>
      <option value="EG">Egypt</option>
      <option value="ZA">South Africa</option>
      <option value="AU">Australia</option>
    </select>

    <label class="hint">Sort</label>
    <select id="sortSelect" disabled>
      <option value="rating">TMDb rating</option>
      <option value="az">A–Z</option>
    </select>

    <button id="goBtn" disabled>&#127916; Discover</button>
  </div>

  <div class="controls" style="margin-top:10px;">
    <label class="hint">Or search by title</label>
    <input id="searchInput" class="search-input" type="text" placeholder="Type a movie title…" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div class="status" id="discoverStatus">Choose a genre to begin.</div>
  <div class="grid" id="movieGrid"></div>
</div>

<div class="panel">
  <div class="controls">
    <label class="hint">Trending this week</label>
    <select id="trendingCountrySelect">
      <option value="">All countries</option>
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
      <option value="FR">France</option>
      <option value="DE">Germany</option>
      <option value="IT">Italy</option>
      <option value="ES">Spain</option>
      <option value="NL">Netherlands</option>
      <option value="SE">Sweden</option>
      <option value="DK">Denmark</option>
      <option value="NO">Norway</option>
      <option value="PL">Poland</option>
      <option value="TR">Turkey</option>
      <option value="EC">Ecuador</option>
      <option value="IN">India</option>
      <option value="JP">Japan</option>
      <option value="KR">South Korea</option>
      <option value="CN">China</option>
      <option value="TW">Taiwan</option>
      <option value="HK">Hong Kong</option>
      <option value="MX">Mexico</option>
      <option value="BR">Brazil</option>
      <option value="AR">Argentina</option>
      <option value="EG">Egypt</option>
      <option value="ZA">South Africa</option>
      <option value="AU">Australia</option>
    </select>
    <button id="trendingBtn">Load trending</button>
  </div>
  <div class="status" id="trendingStatus">Pick a country or leave as all, then load trending movies.</div>
  <div class="trending-strip" id="trendingStrip"></div>
</div>

<script>
  // ---- state ----
  let selectedGenreId = null;

  const el = {
    scatter: document.getElementById("genreScatter"),
    genreStatus: document.getElementById("genreStatus"),
    country: document.getElementById("countrySelect"),
    sort: document.getElementById("sortSelect"),
    go: document.getElementById("goBtn"),
    status: document.getElementById("discoverStatus"),
    grid: document.getElementById("movieGrid"),
    searchInput: document.getElementById("searchInput"),
    searchBtn: document.getElementById("searchBtn"),
    trendingCountry: document.getElementById("trendingCountrySelect"),
    trendingBtn: document.getElementById("trendingBtn"),
    trendingStatus: document.getElementById("trendingStatus"),
    trendingStrip: document.getElementById("trendingStrip"),
  };

  // ---- genre colour map (TMDB IDs → tone-matching colours) ----
  const GENRE_COLORS = {
    28:    { bg: 'rgba(239, 68, 68, 0.18)',  border: 'rgba(239, 68, 68, 0.40)',  hex: '#ef4444' },  // Action – red
    12:    { bg: 'rgba(234,179, 8, 0.18)',   border: 'rgba(234,179, 8, 0.40)',   hex: '#eab308' },  // Adventure – gold
    16:    { bg: 'rgba(56,189,248, 0.18)',    border: 'rgba(56,189,248, 0.40)',   hex: '#38bdf8' },  // Animation – sky blue
    35:    { bg: 'rgba(250,204, 21, 0.18)',   border: 'rgba(250,204, 21, 0.40)',  hex: '#facc15' },  // Comedy – yellow
    80:    { bg: 'rgba(153, 27, 27, 0.22)',   border: 'rgba(153, 27, 27, 0.45)',  hex: '#991b1b' },  // Crime – velvet red
    99:    { bg: 'rgba(148,163,184, 0.18)',   border: 'rgba(148,163,184, 0.40)',  hex: '#94a3b8' },  // Documentary – slate
    18:    { bg: 'rgba(139, 92,246, 0.18)',   border: 'rgba(139, 92,246, 0.40)',  hex: '#8b5cf6' },  // Drama – violet
    10751: { bg: 'rgba(251,146,60, 0.18)',    border: 'rgba(251,146,60, 0.40)',   hex: '#fb923c' },  // Family – orange
    14:    { bg: 'rgba(168,85,247, 0.18)',    border: 'rgba(168,85,247, 0.40)',   hex: '#a855f7' },  // Fantasy – purple
    36:    { bg: 'rgba(180,83, 9, 0.20)',     border: 'rgba(180,83, 9, 0.42)',    hex: '#b45309' },  // History – brown/amber
    27:    { bg: 'rgba(220, 38, 38, 0.20)',   border: 'rgba(220, 38, 38, 0.45)',  hex: '#dc2626' },  // Horror – deep red
    10402: { bg: 'rgba(34,211,238, 0.18)',    border: 'rgba(34,211,238, 0.40)',   hex: '#22d3ee' },  // Music – cyan
    9648:  { bg: 'rgba(99, 102,241, 0.18)',   border: 'rgba(99,102,241, 0.40)',   hex: '#6366f1' },  // Mystery – indigo
    10749: { bg: 'rgba(244,114,182, 0.20)',   border: 'rgba(244,114,182, 0.42)',  hex: '#f472b6' },  // Romance – pink
    878:   { bg: 'rgba(20,184,166, 0.18)',    border: 'rgba(20,184,166, 0.40)',   hex: '#14b8a6' },  // Sci-Fi – teal
    10770: { bg: 'rgba(161,161,170, 0.16)',   border: 'rgba(161,161,170, 0.35)',  hex: '#a1a1aa' },  // TV Movie – grey
    53:    { bg: 'rgba(245,158, 11, 0.18)',   border: 'rgba(245,158, 11, 0.40)',  hex: '#f59e0b' },  // Thriller – amber
    10752: { bg: 'rgba(107,114,128, 0.20)',   border: 'rgba(107,114,128, 0.42)',  hex: '#6b7280' },  // War – steel grey
    37:    { bg: 'rgba(217,119, 6, 0.18)',    border: 'rgba(217,119, 6, 0.40)',   hex: '#d97706' },  // Western – warm amber
  };

  const DEFAULT_COLOR = { bg: 'rgba(255,255,255,0.06)', border: 'rgba(255,255,255,0.15)', hex: '#a1a1aa' };

  function chipStyle(genreId) {
    const ids = String(genreId).split(',').map(Number);
    if (ids.length === 1) {
      const c = GENRE_COLORS[ids[0]] || DEFAULT_COLOR;
      return { background: c.bg, borderColor: c.border };
    }
    // pair: gradient between the two genre colours
    const c1 = GENRE_COLORS[ids[0]] || DEFAULT_COLOR;
    const c2 = GENRE_COLORS[ids[1]] || DEFAULT_COLOR;
    return {
      background: `linear-gradient(135deg, ${c1.bg} 0%, ${c2.bg} 100%)`,
      borderColor: c1.border,
    };
  }

  // ---- helpers ----
  function setEnabled(enabled) {
    el.country.disabled = !enabled;
    el.sort.disabled = !enabled;
    el.go.disabled = !enabled || !el.country.value;
  }

  function posterUrl(path) {
    if (!path) return null;
    return `https://image.tmdb.org/t/p/w342${path}`;
  }

  function clearGrid() {
    el.grid.innerHTML = "";
  }

  function clearTrendingStrip() {
    el.trendingStrip.innerHTML = "";
  }

  function renderMovies(movies) {
    clearGrid();

    if (!movies || movies.length === 0) {
      el.status.textContent = "No results. Try another country or genre.";
      return;
    }

    for (const m of movies) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = `/movie/${m.id}/`;

      const poster = document.createElement("div");
      poster.className = "poster";

      const url = posterUrl(m.poster_path);
      if (url) {
        const img = document.createElement("img");
        img.src = url;
        img.alt = m.title || m.original_title || "Movie poster";
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "cover";
        poster.innerHTML = "";
        poster.appendChild(img);
      } else {
        poster.textContent = "No poster";
      }

      const meta = document.createElement("div");
      meta.className = "meta";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = m.original_title || m.title || "Untitled";

      const sub = document.createElement("div");
      sub.className = "sub";

      const year = document.createElement("span");
      year.textContent = (m.release_date ? m.release_date.slice(0,4) : "—");

      const rating = document.createElement("span");
      rating.textContent = (typeof m.vote_average === "number" ? `★ ${m.vote_average.toFixed(1)}` : "★ —");

      sub.appendChild(year);
      sub.appendChild(rating);

      meta.appendChild(title);
      meta.appendChild(sub);

      card.appendChild(poster);
      card.appendChild(meta);

      el.grid.appendChild(card);
    }
  }

  function renderTrending(movies) {
    clearTrendingStrip();

    if (!movies || movies.length === 0) {
      el.trendingStatus.textContent = "No trending movies found for this country.";
      return;
    }

    for (const m of movies.slice(0, 20)) {
      const card = document.createElement("a");
      card.className = "trending-card";
      card.href = `/movie/${m.id}/`;

      const poster = document.createElement("div");
      poster.className = "poster";

      const url = posterUrl(m.poster_path);
      if (url) {
        const img = document.createElement("img");
        img.src = url;
        img.alt = m.title || m.original_title || "Movie poster";
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "cover";
        poster.appendChild(img);
      } else {
        poster.textContent = "No poster";
      }

      const meta = document.createElement("div");
      meta.className = "meta";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = m.original_title || m.title || "Untitled";

      const sub = document.createElement("div");
      sub.className = "sub";

      const year = document.createElement("span");
      year.textContent = (m.release_date ? m.release_date.slice(0,4) : "—");

      const rating = document.createElement("span");
      rating.textContent = (typeof m.vote_average === "number" ? `★ ${m.vote_average.toFixed(1)}` : "★ —");

      sub.appendChild(year);
      sub.appendChild(rating);

      meta.appendChild(title);
      meta.appendChild(sub);

      card.appendChild(poster);
      card.appendChild(meta);

      el.trendingStrip.appendChild(card);
    }
  }

  function placeChips(items) {
    el.scatter.innerHTML = "";
    const sorted = [...items].sort((a, b) => a.name.localeCompare(b.name));
    sorted.forEach((item) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = item.name;
      chip.dataset.genreId = item.id;

      const cs = chipStyle(item.id);
      chip.style.background = cs.background;
      chip.style.borderColor = cs.borderColor;

      chip.addEventListener("click", () => {
        selectedGenreId = item.id;
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
        el.genreStatus.textContent = `Selected genre: ${item.name}`;
        el.status.textContent = "Now select a country, then click Discover.";
        setEnabled(true);
      });

      el.scatter.appendChild(chip);
    });
  }

  async function loadGenres() {
    el.genreStatus.textContent = "Loading genres…";
    try {
      const res = await fetch("/genres/");
      if (!res.ok) throw new Error(`Genres error: ${res.status}`);
      const data = await res.json();
      
      // Expecting either {genres:[...], pairs:[...]} or just [...]
      const baseGenres = Array.isArray(data) ? data : (data.genres || []);
      if (!baseGenres.length) {
        el.genreStatus.textContent = "No genres returned from /genres/.";
        return;
      }

      const pairs = Array.isArray(data.pairs) ? data.pairs : [];

      const singleChips = baseGenres.map(g => ({
        id: String(g.id),
        name: g.name,
      }));

      // Turn pair objects into chips; cap to avoid overcrowding
      const MAX_PAIR_CHIPS = 40;
      let pairChips = pairs.map(p => ({
        id: p.id, // already like "18,10749" and usable as with_genres
        name: p.label || p.name || String(p.id),
      }));

      if (pairChips.length > MAX_PAIR_CHIPS) {
        // simple shuffle + slice
        pairChips = pairChips
          .map(p => ({ p, r: Math.random() }))
          .sort((a, b) => a.r - b.r)
          .slice(0, MAX_PAIR_CHIPS)
          .map(x => x.p);
      }

      const allChips = [...singleChips, ...pairChips];

      // Scale scatter height based on how many chips we have so it
      // stays visually balanced and not overcrowded.
      const perRow = 7; // rough target number of chips per visual row
      const rows = Math.max(1, Math.ceil(allChips.length / perRow));
      const baseHeight = 260; // minimum height
      const rowHeight = 56;   // vertical space per "row" of chips
      const targetHeight = Math.max(baseHeight, rows * rowHeight);
      el.scatter.style.height = `${targetHeight}px`;

      el.genreStatus.textContent = "Pick a genre or genre pair.";
      placeChips(allChips);
    } catch (e) {
      el.genreStatus.textContent = `Failed to load genres. ${e.message}`;
    }
  }

  async function discover() {
    if (!selectedGenreId) return;
    if (!el.country.value) return;

    const sort = el.sort.value || "rating";
    const country = el.country.value;

    el.status.textContent = "Discovering…";
    clearGrid();

    const params = new URLSearchParams({
      genre: String(selectedGenreId),
      country: country,
      sort: sort,
    });

    try {
      const res = await fetch(`/discover/?${params.toString()}`);
      if (!res.ok) throw new Error(`Discover error: ${res.status}`);
      const data = await res.json();

      // Expecting either {results:[...]} or [...]
      const movies = Array.isArray(data) ? data : (data.results || []);
      el.status.textContent = `Showing ${movies.length} results.`;
      renderMovies(movies);
    } catch (e) {
      el.status.textContent = `Failed to discover movies. ${e.message}`;
    }
  }

  async function searchByTitle() {
    const q = (el.searchInput.value || "").trim();
    if (!q) {
      el.status.textContent = "Type a title to search.";
      return;
    }

    el.status.textContent = `Searching for "${q}"…`;
    clearGrid();

    const params = new URLSearchParams({ q });
    try {
      const res = await fetch(`/search/?${params.toString()}`);
      if (!res.ok) throw new Error(`Search error: ${res.status}`);
      const data = await res.json();
      const movies = Array.isArray(data) ? data : (data.results || []);
      el.status.textContent = `Found ${movies.length} results for "${q}".`;
      renderMovies(movies);
    } catch (e) {
      el.status.textContent = `Failed to search. ${e.message}`;
    }
  }

  async function loadTrending() {
    const country = (el.trendingCountry.value || "").trim();
    const params = new URLSearchParams();
    if (country) params.set("country", country);

    el.trendingStatus.textContent = country
      ? `Loading trending movies for ${country}…`
      : "Loading trending movies across all countries…";
    clearTrendingStrip();

    try {
      const res = await fetch(`/api/trending/${params.toString() ? `?${params.toString()}` : ""}`);
      if (!res.ok) throw new Error(`Trending error: ${res.status}`);
      const data = await res.json();
      const movies = Array.isArray(data) ? data : (data.results || []);
      el.trendingStatus.textContent = country
        ? `Showing trending movies for ${country}.`
        : "Showing trending movies across all countries.";
      renderTrending(movies);
    } catch (e) {
      el.trendingStatus.textContent = `Failed to load trending. ${e.message}`;
    }
  }

  // ---- events ----
  el.country.addEventListener("change", () => {
    el.go.disabled = !selectedGenreId || !el.country.value;
  });

  el.sort.addEventListener("change", () => {
    if (selectedGenreId && el.country.value) discover();
  });

  el.go.addEventListener("click", discover);

  el.searchBtn.addEventListener("click", searchByTitle);
  el.searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      searchByTitle();
    }
  });

  el.trendingBtn.addEventListener("click", loadTrending);

  // initial
  setEnabled(false);
  loadGenres();
  loadTrending();

  // re-layout chips on resize
  window.addEventListener("resize", () => {
    // quick re-fetchless reposition: read existing chips -> reconstruct from labels/ids
    const chips = Array.from(document.querySelectorAll(".chip")).map(c => ({
      id: c.dataset.genreId,
      name: c.textContent
    }));
    if (chips.length) placeChips(chips);
    // preserve selected state
    if (selectedGenreId) {
      const sel = document.querySelector(`.chip[data-genre-id="${selectedGenreId}"]`);
      if (sel) sel.classList.add("selected");
    }
  });
</script>

{% endblock %}
