<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EveryMovie</title>
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --card: #141417;
      --stroke: #2a2a2f;
      --radius: 16px;
      --accent: #8b5cf6;
      --accent-dim: rgba(139,92,246,0.14);
      --accent-glow: rgba(139,92,246,0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      line-height: 1.4;
      /* very faint top glow */
      background-image: radial-gradient(ellipse 80% 35% at 50% -5%, rgba(139,92,246,0.07) 0%, transparent 70%);
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; position: relative; z-index: 1; }

    /* ---- animated side movie columns ---- */
    .side-movies {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 270px;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .side-movies.left  { left: 0; }
    .side-movies.right { right: 0; }
    .side-col {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 120px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
    }
    .side-movies.left  .side-col:first-child { left: 8px; }
    .side-movies.left  .side-col:last-child  { left: 140px; }
    .side-movies.right .side-col:first-child { right: 140px; }
    .side-movies.right .side-col:last-child  { right: 8px; }
    .side-poster {
      position: absolute;
      width: 120px;
      height: 180px;
      border-radius: 10px;
      overflow: hidden;
      opacity: 0.16;
      display: block;
      pointer-events: auto;
      transition: opacity .2s, transform .15s;
    }
    .side-poster:hover {
      opacity: 0.45;
      transform: scale(1.04);
    }
    .side-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (max-width: 1540px) { .side-movies { display: none; } }
    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(139,92,246,0.10);
    }
    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
      background: linear-gradient(135deg, var(--fg) 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand::before {
      content: '\1F3AC';
      -webkit-text-fill-color: initial;
      font-size: 18px;
      filter: grayscale(0.5) brightness(1.2);
    }
    .hint { color: var(--muted); font-size: 15px; font-weight: 600; }

    .panel {
      margin-top: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 14px;
    }

    /* banner variant for the genre scatter */
    .genre-banner {
      padding: 24px 22px 18px;
      background: linear-gradient(175deg, rgba(139,92,246,0.06) 0%, rgba(255,255,255,0.015) 50%, transparent 100%);
      border-color: rgba(139,92,246,0.18);
    }
    .banner-title {
      margin: 0 0 14px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, var(--fg) 50%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .scatter {
      position: relative;
      min-height: 340px;
      border-radius: var(--radius);
      border: 1px dashed rgba(139,92,246,0.16);
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 50%, var(--accent-glow) 0%, transparent 70%);
    }
    .chip {
      position: absolute;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      cursor: pointer;
      user-select: none;
      transition: transform .08s ease, filter .15s ease, border-color .15s ease, box-shadow .15s ease;
      font-size: 15px;
      white-space: nowrap;
    }
    .chip:hover {
      transform: scale(1.08);
      filter: brightness(1.4);
      box-shadow: 0 0 14px rgba(255,255,255,0.08);
    }
    .chip.selected {
      filter: brightness(1.5);
      box-shadow: 0 0 18px rgba(255,255,255,0.12);
      transform: scale(1.06);
    }

    .controls { display:flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    select, button {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 16px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    select {
      padding-right: 28px;
      cursor: pointer;
    }
    select:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.22);
    }
    select:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    /* dropdown list background in supporting browsers */
    select option {
      background: #050508;
      color: var(--fg);
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) {
      background: var(--accent-dim);
      border-color: rgba(139,92,246,0.30);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .search-input {
      padding: 11px 12px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      min-width: 220px;
    }
    .search-input:focus { border-color: rgba(139,92,246,0.45); }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr);} }
    @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr);} }

    .card {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 260px;
      transition: border-color .2s, box-shadow .2s, transform .15s;
    }
    .card:hover {
      border-color: rgba(139,92,246,0.28);
      box-shadow: 0 4px 24px rgba(139,92,246,0.08);
      transform: translateY(-2px);
    }
    .poster {
      width: 100%;
      aspect-ratio: 2/3;
      background: rgba(255,255,255,0.06);
      display:flex;
      align-items:center;
      justify-content:center;
      color: var(--muted);
      font-size: 12px;
    }
    .meta { padding: 10px 10px 12px; display:flex; flex-direction:column; gap: 6px; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; display:flex; justify-content: space-between; gap: 10px; }

    .status { color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 10px; }

    /* ---- trending strip ---- */
    .trending-strip {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .trending-strip::-webkit-scrollbar {
      height: 6px;
    }
    .trending-strip::-webkit-scrollbar-thumb {
      background: rgba(139,92,246,0.35);
      border-radius: 999px;
    }
    .trending-card {
      flex: 0 0 140px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 220px;
      transition: border-color .18s, box-shadow .18s, transform .12s;
    }
    .trending-card:hover {
      border-color: rgba(139,92,246,0.32);
      box-shadow: 0 4px 18px rgba(139,92,246,0.14);
      transform: translateY(-1px);
    }
    .trending-card .poster {
      aspect-ratio: 2/3;
    }
    .trending-card .meta {
      padding: 8px 8px 10px;
    }
    .trending-card .title {
      font-size: 13px;
      font-weight: 700;
    }
    .trending-card .sub {
      font-size: 12px;
    }

    /* ---- auth nav ---- */
    .auth-nav { display: flex; gap: 16px; align-items: center; font-size: 16px; font-weight: 600; }
    .auth-nav a {
      color: var(--fg);
      transition: color .15s, text-shadow .15s;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(139,92,246,0.15);
      background: rgba(139,92,246,0.06);
    }
    .auth-nav a:hover {
      color: var(--accent);
      background: rgba(139,92,246,0.14);
      border-color: rgba(139,92,246,0.35);
      text-shadow: 0 0 12px rgba(139,92,246,0.25);
    }
    .auth-nav .user-greeting {
      color: var(--fg);
      font-weight: 700;
      font-size: 16px;
    }

    /* ---- auth forms ---- */
    .auth-panel {
      max-width: 380px;
      margin: 60px auto 0;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 28px 24px;
    }
    .auth-panel h2 { margin: 0 0 18px; font-size: 18px; font-weight: 650; }
    .auth-panel h2::before { content: '\1F511 '; font-size: 15px; }
    .auth-panel label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .auth-panel input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .auth-panel input:focus { border-color: rgba(139,92,246,0.45); }
    .auth-panel .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent-dim);
      color: var(--fg);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .auth-panel .btn:hover {
      background: rgba(139,92,246,0.22);
      box-shadow: 0 0 16px rgba(139,92,246,0.12);
    }
    .auth-panel .switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
    .auth-panel .switch a { color: var(--accent); font-weight: 600; }
    .auth-panel .error-msg { color: #f87171; font-size: 13px; margin-bottom: 12px; }

    /* ---- movie detail ---- */
    .movie-hero {
      display: flex;
      gap: 28px;
      margin-top: 24px;
    }
    .movie-hero .hero-poster {
      flex-shrink: 0;
      width: 260px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--stroke);
    }
    .movie-hero .hero-poster img { width: 100%; display: block; }
    .movie-hero .hero-info { flex: 1; min-width: 0; }
    .movie-hero .hero-info h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 6px;
      line-height: 1.2;
      background: linear-gradient(135deg, var(--fg) 60%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .movie-hero .hero-info .tagline { color: var(--muted); font-style: italic; font-size: 14px; margin-bottom: 14px; }
    .movie-hero .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .movie-hero .hero-meta span { white-space: nowrap; }
    .movie-hero .hero-meta .rating-badge { color: #facc15; font-weight: 600; }
    .movie-hero .overview { font-size: 14px; line-height: 1.65; color: rgba(244,244,245,0.85); margin-bottom: 18px; }
    .movie-hero .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .movie-hero .genre-tag {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(139,92,246,0.18);
      background: var(--accent-glow);
      font-size: 12px;
      color: var(--muted);
    }
    .cast-section { margin-top: 24px; }
    .cast-section h3 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .cast-section h3::before { content: '\1F3AD '; }
    .cast-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .cast-card {
      flex-shrink: 0;
      width: 100px;
      text-align: center;
    }
    .cast-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
    }
    .cast-card .cast-name { font-size: 12px; font-weight: 600; margin-top: 6px; }
    .cast-card .cast-char { font-size: 11px; color: var(--muted); }
    .back-link { display: inline-block; margin-top: 20px; color: var(--muted); font-size: 13px; transition: color .15s; }
    .back-link::before { content: ''; }
    .back-link:hover { color: var(--accent); }

    @media (max-width: 680px) {
      .movie-hero { flex-direction: column; }
      .movie-hero .hero-poster { width: 200px; }
    }

    /* ---- add-to-list widget ---- */
    .add-to-list-widget {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .add-to-list-widget select {
      max-width: 220px;
    }
    .add-to-list-widget .btn-add {
      padding: 9px 16px;
      background: var(--accent-dim);
      color: var(--fg);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .add-to-list-widget .btn-add:hover {
      background: rgba(139,92,246,0.22);
      box-shadow: 0 0 14px rgba(139,92,246,0.10);
    }
    .inline-create {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .inline-create input {
      padding: 8px 10px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      width: 160px;
    }
    .inline-create input:focus { border-color: rgba(139,92,246,0.45); }
    .inline-create button {
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 10px;
    }

    /* ---- my lists page ---- */
    .lists-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    .lists-header h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .list-section {
      margin-top: 22px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 16px;
    }
    .list-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .list-section-header h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .list-actions { display: flex; gap: 8px; }
    .list-actions button, .list-actions .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      cursor: pointer;
      transition: color .15s, background .15s;
    }
    .list-actions button:hover, .list-actions .btn-sm:hover { color: var(--fg); background: rgba(255,255,255,0.1); }
    .list-actions .btn-danger:hover { color: #f87171; }
    .list-items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .list-item-card {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .list-item-card:hover {
      border-color: rgba(139,92,246,0.28);
      box-shadow: 0 2px 16px rgba(139,92,246,0.08);
    }
    .list-item-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
    }
    .list-item-card .li-title {
      padding: 6px 6px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-item-card .li-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      color: #f87171;
      border: none;
      font-size: 13px;
      line-height: 22px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }
    .list-item-card:hover .li-remove { opacity: 1; }
    .empty-list { color: var(--muted); font-size: 13px; }
    .empty-list::before { content: '\1F37F '; }
    .success-msg { color: #4ade80; font-size: 13px; margin-bottom: 8px; }
    .error-msg-global { color: #f87171; font-size: 13px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="{% url 'home' %}" class="brand">EveryMovie</a>
      <div class="auth-nav">
        {% if user.is_authenticated %}
          <a href="{% url 'my_lists' %}">&#128203; My Lists</a>
          <span class="user-greeting">&#128100; {{ user.username }}</span>
          <a href="{% url 'logout' %}">Sign out</a>
        {% else %}
          <a href="{% url 'login' %}">&#128274; Log in</a>
          <a href="{% url 'signup' %}">&#9998; Sign up</a>
        {% endif %}
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>

  <!-- Animated side movie columns (hidden on narrow screens via CSS) -->
  <div class="side-movies left">
    <div class="side-col" id="sideColL1"></div>
    <div class="side-col" id="sideColL2"></div>
  </div>
  <div class="side-movies right">
    <div class="side-col" id="sideColR1"></div>
    <div class="side-col" id="sideColR2"></div>
  </div>

  <script>
  (function() {
    var CARD_H = 180, GAP = 12, SPACING = CARD_H + GAP, SPEED = 22;
    var pool = [], pi = 0;

    function next() {
      if (!pool.length) return null;
      return pool[pi++ % pool.length];
    }

    function makeCard(movie, col) {
      var d = document.createElement('a');
      d.className = 'side-poster';
      if (movie) {
        d.href = '/movie/' + movie.id + '/';
        if (movie.poster_path) {
          var img = document.createElement('img');
          img.src = 'https://image.tmdb.org/t/p/w342' + movie.poster_path;
          img.alt = movie.title || '';
          d.appendChild(img);
        }
      }
      d._movieId = movie ? movie.id : null;
      col.appendChild(d);
      return d;
    }

    function swapCard(c) {
      var m = next();
      c.el.innerHTML = '';
      if (m) {
        c.el.href = '/movie/' + m.id + '/';
        c.el._movieId = m.id;
        if (m.poster_path) {
          var img = document.createElement('img');
          img.src = 'https://image.tmdb.org/t/p/w342' + m.poster_path;
          img.alt = m.title || '';
          c.el.appendChild(img);
        }
      }
    }

    function buildCol(container, dir) {
      var vh = window.innerHeight;
      var count = Math.ceil(vh / SPACING) + 2;
      var cards = [];
      for (var i = 0; i < count; i++) {
        var m = next();
        var el = makeCard(m, container);
        var y = i * SPACING;
        el.style.top = y + 'px';
        cards.push({ el: el, y: y });
      }
      return { cards: cards, dir: dir };
    }

    function animate(cols) {
      var prev = performance.now();
      function tick(now) {
        var dt = (now - prev) / 1000;
        prev = now;
        var vh = window.innerHeight;
        for (var ci = 0; ci < cols.length; ci++) {
          var col = cols[ci];
          var cards = col.cards;
          for (var i = 0; i < cards.length; i++) {
            cards[i].y += col.dir * SPEED * dt;
            cards[i].el.style.top = cards[i].y + 'px';
          }
          for (var i = 0; i < cards.length; i++) {
            var c = cards[i];
            if (col.dir === -1 && c.y + CARD_H < 0) {
              var maxY = -Infinity;
              for (var j = 0; j < cards.length; j++) {
                if (j !== i && cards[j].y > maxY) maxY = cards[j].y;
              }
              c.y = maxY + SPACING;
              swapCard(c);
              c.el.style.top = c.y + 'px';
            }
            if (col.dir === 1 && c.y > vh) {
              var minY = Infinity;
              for (var j = 0; j < cards.length; j++) {
                if (j !== i && cards[j].y < minY) minY = cards[j].y;
              }
              c.y = minY - SPACING;
              swapCard(c);
              c.el.style.top = c.y + 'px';
            }
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function init() {
      Promise.all([
        fetch('/api/trending/'),
        fetch('/api/trending/?page=2')
      ]).then(function(responses) {
        return Promise.all(responses.map(function(r) {
          return r.ok ? r.json() : { results: [] };
        }));
      }).then(function(data) {
        pool = [].concat(data[0].results || [], data[1].results || []).filter(function(m) {
          return m.poster_path;
        });
        if (pool.length < 4) return;
        // shuffle
        for (var i = pool.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
        }
        var cols = [
          buildCol(document.getElementById('sideColL1'), -1),
          buildCol(document.getElementById('sideColL2'),  1),
          buildCol(document.getElementById('sideColR1'),  1),
          buildCol(document.getElementById('sideColR2'), -1)
        ];
        animate(cols);
      }).catch(function() {});
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
